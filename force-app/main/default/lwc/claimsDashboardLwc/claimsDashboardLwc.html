<template>
    <lightning-card
        title="My Assigned Claims Dashboard"
        icon-name="standard:case">

        <div class="slds-m-around_medium">

            <lightning-combobox
                name="policyFilter"
                label="Filter by Policy Type"
                value={selectedPolicyType}
                options={policyTypeOptions}
                onchange={handleFilterChange}>
            </lightning-combobox>

            <template if:true={visibleClaims}>

                <div class="slds-grid slds-wrap slds-m-top_medium">

                    <template
                        for:each={visibleClaims}
                        for:item="claim">

                        <div
                            key={claim.claimId}
                            class="slds-col slds-size_1-of-1
                                   slds-medium-size_1-of-2
                                   slds-large-size_1-of-3
                                   slds-p-around_small">

                            <c-claim-tile-lwc
                                claim={claim}>
                            </c-claim-tile-lwc>

                        </div>

                    </template>

                </div>

                <p class="slds-m-top_medium slds-text-heading_small">
                    Total Claims Assigned:
                    {visibleClaims.length}
                </p>

            </template>

            <template if:false={visibleClaims}>
                <p>No claims currently assigned to you.</p>
            </template>

        </div>

    </lightning-card>
</template>
